<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OfflineMesh guest</title>
<style>
body { font-family: system-ui, sans-serif; font-size: 16px; color: #000; background: #fff; margin: 8px; }
input[type=text] { width: 100%; box-sizing: border-box; font-size: 16px; margin: 4px 0; }
button { font-size: 16px; margin: 4px 4px 4px 0; }
ul { list-style: none; padding: 0; }
li { border-bottom: 1px solid #ccc; padding: 6px 0; }
.grey { color: #666; font-size: 13px; }
</style>
</head>
<body>
<header>OfflineMesh guest <span id="err" class="grey"></span></header>
<p class="grey">Your posts are signed by the host phone, not by you. Guests have no keys and no direct messages.</p>
<input type="text" id="name" placeholder="Your name" maxlength="20">
<input type="text" id="text" placeholder="Write a post">
<button id="post">Post</button>
<ul id="posts"></ul>
<script>
const $ = id => document.getElementById(id);
const pin = encodeURIComponent(new URLSearchParams(location.search).get('pin') || '');
try { $('name').value = localStorage.getItem('guestName') || ''; } catch (e) {}

function line(m) {
  const g = /^\[guest ([^\]]*)\] ([\s\S]*)$/.exec(m.text);
  return g ? m.from.slice(0, 8) + ' [guest: ' + g[1] + ']: ' + g[2] : m.from.slice(0, 8) + ': ' + m.text;
}

async function poll() {
  try {
    const r = await fetch('/api/feed?pin=' + pin);
    if (!r.ok) { $('err').textContent = r.status === 403 ? 'wrong PIN' : 'error ' + r.status; return; }
    const feed = await r.json();
    $('err').textContent = '';
    $('posts').replaceChildren(...feed.slice().reverse().map(m => {
      const li = document.createElement('li'); li.textContent = line(m); return li;
    }));
  } catch (e) { $('err').textContent = 'offline'; }
}

$('post').onclick = async () => {
  const name = $('name').value.trim(), text = $('text').value.trim();
  if (!name || !text) { $('err').textContent = 'enter a name and a post'; return; }
  try { localStorage.setItem('guestName', name); } catch (e) {}
  try {
    const r = await fetch('/api/guest-post?pin=' + pin, { method: 'POST', body: JSON.stringify({ name, text }) });
    if (r.ok) { $('text').value = ''; $('err').textContent = 'sent'; poll(); }
    else $('err').textContent = await r.text();
  } catch (e) { $('err').textContent = 'offline'; }
};

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
